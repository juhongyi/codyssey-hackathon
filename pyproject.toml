[project]
name = "odyssey-planner"
version = "0.1.0"
description = "Voice interview API and five-year Odyssey planning engines"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.16,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

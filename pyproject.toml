[project]
name = "odyssey-planner"
version = "0.1.0"
description = "한국어 음성 인터뷰와 Designing Your Life 오디세이 플래너"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "numpy>=2.2,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "sounddevice>=0.5,<1",
]

[project.scripts]
odyssey = "odyssey_planner.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

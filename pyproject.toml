[project]
name = "odyssey-planner"
version = "0.1.0"
description = "Console voice interview and five-year Odyssey planning agents"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.16,<3",
    "numpy>=2.2,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "sounddevice>=0.5,<1",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "ty>=0.0.95",
]

[tool.uv]
package = false

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["interview.py", "planner.py", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

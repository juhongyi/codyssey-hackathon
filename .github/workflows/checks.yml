name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build services
        run: docker compose build
      - name: Start PostgreSQL
        run: docker compose up -d --wait db
      - name: Backend and agents checks
        run: |
          docker compose run --rm --no-deps backend sh -ec '
            uv run ruff check .
            uv run ruff format --check .
            uv run ty check
            uv run pytest tests agents/tests
            uv run lint-imports
          '
      - name: Frontend checks
        run: |
          docker compose run --rm --no-deps frontend sh -ec '
            pnpm exec vitest run
            pnpm run typecheck
            pnpm exec biome check .
            pnpm run depcruise
            pnpm run build
          '
      - name: Browser regression checks (desktop and mobile)
        run: docker compose --profile test run --build --rm --no-deps e2e

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'EOF'
          set -e
          mkdir -p /home/ubuntu/odyssey
          cd /home/ubuntu/odyssey
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/juhongyi/codyssey-hackathon.git
          fi
          git fetch origin && git reset --hard origin/main
          [ -f .env ] || cp .env.example .env
          docker compose up -d --build
          EOF

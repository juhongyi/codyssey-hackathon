[project]
name = "odyssey-backend"
version = "0.1.0"
description = "ODYSSEY life design journal API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "ty>=0.0.1,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty]
enabled = true

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - odyssey-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CODYSSEY_API_BASE_URL: ${CODYSSEY_API_BASE_URL:-https://copa.codyssey.kr}
      CODYSSEY_API_KEY: ${CODYSSEY_API_KEY:-}
      INTERVIEWER_LLM_MODEL: ${INTERVIEWER_LLM_MODEL:-claude-haiku-4}
      PLANNER_LLM_MODEL: ${PLANNER_LLM_MODEL:-gpt-5.5}
      CODYSSEY_TTS_MODEL: ${CODYSSEY_TTS_MODEL:-gpt-4o-mini-tts}
      CODYSSEY_TTS_VOICE: ${CODYSSEY_TTS_VOICE:-alloy}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      WORKERS_AI_STT_MODEL: ${WORKERS_AI_STT_MODEL:-@cf/openai/whisper-large-v3-turbo}
      INTERVIEW_MAX_QUESTIONS: ${INTERVIEW_MAX_QUESTIONS:-10}
      AUDIO_STORAGE_PATH: /app/storage/audio
    volumes:
      - ./storage/audio:/app/storage/audio
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  odyssey-db-data:
  caddy_data:
  caddy_config:

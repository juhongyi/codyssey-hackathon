pre-commit:
  parallel: true
  commands:
    ruff-lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    biome:
      glob: "*.{json,jsonc,js,jsx,ts,tsx,cjs,mjs,css}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}

pre-push:
  parallel: true
  commands:
    ruff-lint:
      run: uv run ruff check .
    ruff-format:
      run: uv run ruff format --check .
    ty:
      run: uv run ty check
    pytest:
      run: uv run pytest
    biome:
      run: pnpm exec biome check .
    # vitest:
    #   run: pnpm exec vitest run

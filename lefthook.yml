pre-commit:
  parallel: true
  commands:
    backend:
      glob: "{backend,agents}/**/*.py"
      run: |
        docker compose exec -T backend sh -ec '
          uv run ruff check .
          uv run ruff format --check .
        '
    biome:
      glob: "frontend/**/*.{json,jsonc,js,jsx,ts,tsx,cjs,mjs,css}"
      run: docker compose exec -T frontend pnpm exec biome check .

pre-push:
  parallel: true
  commands:
    backend:
      run: |
        docker compose exec -T backend sh -ec '
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run pytest tests agents/tests
          uv run lint-imports
        '
    frontend:
      run: |
        docker compose exec -T frontend sh -ec '
          pnpm exec vitest run
          pnpm run typecheck
          pnpm exec biome check .
          pnpm run depcruise
          pnpm run build
        '

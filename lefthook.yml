pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{json,jsonc,js,jsx,ts,tsx,cjs,mjs,css}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}

pre-push:
  parallel: true
  commands:
    biome:
      run: pnpm exec biome check .
    types:
      run: pnpm typecheck
    vitest:
      run: pnpm test
